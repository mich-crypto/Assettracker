<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AssetTracker</title>
  <meta name="theme-color" content="#0b5cad">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="narrow">
    <header class="home-head">
      <h1>Asset<span style="color:var(--primary)">Tracker</span></h1>
      <p class="project-title" id="project-name"></p>
    </header>

    <section class="card hidden" id="install-card" aria-labelledby="install-title">
      <h2 id="install-title">Put the app on your home screen</h2>
      <p class="muted" id="install-device"></p>
      <ol class="steps" id="install-steps"></ol>
      <div class="row">
        <button class="btn btn-primary hidden" id="install-btn" type="button">Install now</button>
        <button class="btn" id="install-done" type="button">Done</button>
        <button class="link-btn" id="install-later" type="button">Not now</button>
      </div>
    </section>

    <h2 class="home-q">What are you doing today?</h2>
    <nav class="role-grid" aria-label="Choose what you want to do">
      <a class="role" id="r-field" href="#"><span class="role-ico" aria-hidden="true">▣</span><b>Scan equipment</b><span>Technicians: scan a QR label and answer a few questions</span></a>
      <a class="role" id="r-warehouse" href="#"><span class="role-ico" aria-hidden="true">＋</span><b>Warehouse</b><span>Add equipment, refuelled, serviced, things to investigate</span></a>
      <a class="role" id="r-overview" href="#"><span class="role-ico" aria-hidden="true">▤</span><b>Overview</b><span>Site manager: what is on the vessel and on each turbine</span></a>
    </nav>
    <p class="muted center"><button class="link-btn" id="show-install" type="button">How do I add this to my home screen?</button></p>
  </main>
  <script type="module" src="/js/project.js"></script>
</body>
</html>
