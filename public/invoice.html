<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Invoice</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light; --ink:#1b2733; --muted:#5b6b7a; --line:#d8dee4; --primary:#0b5cad; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef1f4; color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .bar { max-width: 820px; margin: 16px auto 0; padding: 0 16px; display: flex; gap: 8px; justify-content: flex-end; }
    button { font: inherit; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--primary); background: var(--primary); color: #fff; cursor: pointer; }
    .sheet { position: relative; max-width: 820px; margin: 12px auto 40px; background: #fff; padding: 40px; border: 1px solid var(--line); border-radius: 6px; }
    h1 { margin: 0 0 4px; font-size: 1.7rem; letter-spacing: .02em; }
    .head { display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
    .muted { color: var(--muted); }
    .addr { white-space: pre-line; }
    table { width: 100%; border-collapse: collapse; margin-top: 28px; }
    th { text-align: left; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border-bottom: 2px solid var(--ink); padding: 6px 4px; }
    td { padding: 9px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .r { text-align: right; white-space: nowrap; }
    .totals { margin: 16px 0 0 auto; width: min(320px, 100%); }
    .totals div { display: flex; justify-content: space-between; padding: 3px 0; }
    .totals .grand { border-top: 2px solid var(--ink); margin-top: 6px; padding-top: 8px; font-weight: 700; font-size: 1.15rem; }
    .meta { margin-top: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px 24px; }
    .meta b { display: block; font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
    .pay { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line); font-size: .92rem; }
    .stamp { display: inline-block; margin-top: 10px; border: 3px solid; border-radius: 4px; padding: 0 12px; font-weight: 800; font-size: 1.2rem; letter-spacing: .08em; transform: rotate(-3deg); }
    .stamp.draft { color: #8a5a00; } .stamp.paid { color: #17803d; } .stamp.void { color: #b42318; }
    #msg { max-width: 820px; margin: 60px auto; padding: 0 16px; text-align: center; color: var(--muted); }
    @media (max-width: 600px) { .sheet { padding: 22px 16px; } }
    @media print { body { background: #fff; } .bar { display: none; } .sheet { border: 0; margin: 0; max-width: none; padding: 0; } }
  </style>
</head>
<body>
  <div class="bar" id="bar" hidden><button type="button" id="print">Print or save as PDF</button></div>
  <div id="msg">Loading invoice…</div>
  <article class="sheet" id="sheet" hidden></article>
  <script type="module" src="/js/invoice.js"></script>
</body>
</html>
