<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AssetTracker</title>
  <meta name="theme-color" content="#0b5cad">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="narrow">
    <h1 style="margin-top:10vh">Asset<span style="color:var(--primary)">Tracker</span></h1>
    <p class="muted">Equipment tracking for offshore wind projects.</p>

    <div id="label-note" class="notice notice-warn hidden"></div>

    <form id="go" class="card">
      <h2>Open your project</h2>
      <p class="muted">Use the link or QR code you received from your project contact. Or enter the project code, for example <b>BLP</b>.</p>
      <div class="field">
        <label for="code">Project code</label>
        <input id="code" type="text" autocapitalize="characters" autocomplete="off" spellcheck="false" maxlength="24" required>
        <div class="field-error" id="code-error"></div>
      </div>
      <button class="btn btn-primary btn-big" type="submit">Open</button>
    </form>
  </main>
  <script type="module">
    import { registerServiceWorker } from '/js/app.js';
    import { SLUG_RE } from '/js/projects.js';
    registerServiceWorker();
    const label = new URLSearchParams(location.search).get('label');
    if (label) {
      const n = document.getElementById('label-note');
      n.textContent = `Label ${label} is not linked to any equipment yet. Open your project link, choose Warehouse → Add equipment, and scan the label there.`;
      n.classList.remove('hidden');
    }
    document.getElementById('go').addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = document.getElementById('code').value.trim();
      const err = document.getElementById('code-error');
      err.textContent = '';
      if (!SLUG_RE.test(code)) { err.textContent = 'A project code is 2 to 24 letters, digits or hyphens.'; return; }
      try {
        const res = await fetch(`/api/p/${encodeURIComponent(code)}/info`);
        if (!res.ok) { err.textContent = 'No project with this code. Check the link you received.'; return; }
        location.href = `/${(await res.json()).project.slug}`;
      } catch { err.textContent = 'No connection.'; }
    });
  </script>
</body>
</html>
