<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AssetTracker</title>
  <meta name="theme-color" content="#0b5cad">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="narrow">
    <h1 style="margin-top:8vh">Asset<span style="color:var(--primary)">Tracker</span></h1>
    <p class="muted">Generator &amp; equipment tracking by QR / NFC tag.</p>

    <form id="login" class="card hidden" autocomplete="on">
      <h2>Sign in</h2>
      <div class="field"><label for="username">Username</label><input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" required></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <div class="field-error" id="login-error"></div>
      <button class="btn btn-primary btn-big" type="submit">Sign in</button>
    </form>

    <form id="setup" class="card hidden">
      <h2>First-time setup</h2>
      <p class="muted">Create the administrator account. You need the <code>SETUP_KEY</code> secret configured on the Worker.</p>
      <div class="field"><label for="s-key">Setup key</label><input id="s-key" name="setupKey" type="password" required></div>
      <div class="field"><label for="s-name">Your name</label><input id="s-name" name="name" type="text" required></div>
      <div class="field"><label for="s-user">Username</label><input id="s-user" name="username" type="text" autocapitalize="none" required></div>
      <div class="field"><label for="s-pass">Password (min. 8 characters)</label><input id="s-pass" name="password" type="password" minlength="8" autocomplete="new-password" required></div>
      <div class="field-error" id="setup-error"></div>
      <button class="btn btn-primary btn-big" type="submit">Create admin</button>
    </form>

    <form id="open" class="card hidden">
      <div class="field">
        <label for="o-name">Your name <span class="req">*</span></label>
        <input id="o-name" name="name" type="text" autocomplete="name" required maxlength="100" placeholder="Saved with your readings">
        <div class="field-error" id="open-error"></div>
      </div>
      <div class="stack">
        <button class="btn btn-primary btn-big" type="submit" value="/field">Scan asset <span class="muted" style="color:inherit;font-weight:400">· technicians</span></button>
        <button class="btn btn-big" type="submit" value="/add">Add equipment <span class="muted">· warehouse, step by step</span></button>
        <button class="btn btn-big" type="submit" value="/link">Link tags <span class="muted">· edit, print labels</span></button>
        <button class="btn btn-big" type="submit" value="/overview">Overview <span class="muted">· site manager</span></button>
        <button class="btn btn-big" type="submit" value="/admin">Setup <span class="muted">· locations &amp; equipment types</span></button>
      </div>
    </form>

    <div id="offline" class="notice notice-warn hidden">You are offline. Sign in once while connected; after that the Scan page works offline.</div>
  </main>
  <script type="module">
    import { api, session, homeFor, registerServiceWorker } from '/js/app.js';
    registerServiceWorker();
    const next = new URLSearchParams(location.search).get('next');
    const go = (user) => location.replace(next && next.startsWith('/') && !next.startsWith('//') ? next : homeFor(user));

    const openForm = document.getElementById('open');
    function showOpen() {
      openForm.name.value = session.user?.open ? session.user.name : '';
      openForm.classList.remove('hidden');
    }
    openForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = openForm.name.value.trim();
      if (!name) {
        document.getElementById('open-error').textContent = 'Enter your name so readings show who recorded them.';
        return openForm.name.focus();
      }
      session.setOpen(name);
      location.href = next && next.startsWith('/') && !next.startsWith('//') ? next : e.submitter?.value || '/field';
    });

    if (session.user?.open) {
      // No-login mode: go straight on when sent here from a page, otherwise offer the screens.
      if (next) go(session.user); else showOpen();
    } else if (session.token && session.user) go(session.user);
    else {
      api('/api/auth/status').then(({ open, needsSetup }) => {
        if (open) return showOpen();
        document.getElementById(needsSetup ? 'setup' : 'login').classList.remove('hidden');
      }).catch(() => {
        document.getElementById('login').classList.remove('hidden');
        document.getElementById('offline').classList.remove('hidden');
      });
    }

    function bind(formId, path, errId) {
      const form = document.getElementById(formId);
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = form.querySelector('button');
        btn.disabled = true;
        try {
          const { token, user } = await api(path, { method: 'POST', body: Object.fromEntries(new FormData(form)) });
          session.set(token, user);
          go(user);
        } catch (err) {
          document.getElementById(errId).textContent = err.message;
        } finally {
          btn.disabled = false;
        }
      });
    }
    bind('login', '/api/auth/login', 'login-error');
    bind('setup', '/api/auth/setup', 'setup-error');
  </script>
</body>
</html>
