<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Scan · AssetTracker</title>
  <meta name="theme-color" content="#0b5cad">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="splash hidden" id="splash" aria-hidden="true">
    <svg viewBox="0 0 64 64" width="96" height="96"><rect width="64" height="64" rx="14" fill="#0b5cad"/><g fill="#fff"><rect class="sq s1" x="12" y="12" width="16" height="16" rx="2"/><rect class="sq s2" x="36" y="12" width="16" height="16" rx="2"/><rect class="sq s3" x="12" y="36" width="16" height="16" rx="2"/></g><g fill="#0b5cad"><rect x="17" y="17" width="6" height="6"/><rect x="41" y="17" width="6" height="6"/><rect x="17" y="41" width="6" height="6"/></g><path class="bolt" d="M45 34l-7 11h6l-2 9 8-12h-6z" fill="#ffd24a"/></svg>
    <div class="splash-name">Asset<b>Tracker</b></div>
  </div>

  <main class="narrow">
    <!-- start: scan something -->
    <section id="view-home">
      <div class="card stack">
        <h1>Scan equipment</h1>
        <button class="btn btn-primary btn-big" id="btn-qr" type="button">Scan QR code</button>
        <button class="btn btn-big hidden" id="btn-nfc" type="button">Read NFC tag</button>
        <form id="manual-code" class="row">
          <input class="grow" name="code" type="text" placeholder="…or type the label code" autocapitalize="characters" autocomplete="off" aria-label="Label code">
          <button class="btn" type="submit">Go</button>
        </form>
        <div class="gps" id="gps" data-state="search" title="GPS"><span class="led" aria-hidden="true"></span>GPS</div>
      </div>
      <div class="card hidden" id="outbox-card">
        <div class="row" style="justify-content:space-between"><h2 style="margin:0">Waiting to sync</h2><button class="btn" id="btn-sync" type="button">Sync now</button></div>
        <div id="outbox" style="margin-top:8px"></div>
      </div>
    </section>

    <!-- equipment that may not be used -->
    <section class="hidden" id="view-blocked">
      <div class="blocked" role="alert">
        <div class="blocked-ico" aria-hidden="true">⛔</div>
        <h1>Do not use</h1>
        <p class="blocked-what" id="blocked-what"></p>
        <p class="blocked-why" id="blocked-why"></p>
        <p>Tell the warehouse supervisor.</p>
      </div>
      <button class="btn btn-big" type="button" id="blocked-back">Back</button>
    </section>

    <!-- the guided questions -->
    <section class="hidden" id="view-flow">
      <div class="wizard-progress" id="progress" aria-hidden="true"></div>
      <div class="row" style="justify-content:space-between;align-items:center">
        <p class="muted wizard-step-label" id="step-label" style="margin:0"></p>
        <button class="link-btn" type="button" id="btn-cancel">Cancel</button>
      </div>
      <section class="card wizard" id="step" aria-live="polite"></section>
      <div class="wizard-nav" id="nav">
        <button type="button" class="btn" id="btn-back">Back</button>
        <button type="button" class="btn btn-primary" id="btn-next">Next</button>
      </div>
      <p class="center"><button class="link-btn" type="button" id="btn-problem">Something is wrong with this equipment or label</button></p>
    </section>
  </main>

  <dialog id="tour" class="pair-dialog" aria-labelledby="tour-title">
    <p class="muted" id="tour-count"></p>
    <h2 id="tour-title"></h2>
    <p id="tour-text"></p>
    <div class="row"><button class="btn btn-primary" type="button" id="tour-next">Next</button><button class="link-btn" type="button" id="tour-skip">Skip</button></div>
  </dialog>

  <dialog id="problem" class="pair-dialog" aria-labelledby="problem-title">
    <h2 id="problem-title"></h2>
    <p id="problem-text"></p>
    <div class="field"><label for="problem-note">What did you see? <span class="muted">(optional)</span></label><textarea id="problem-note" maxlength="500" placeholder="e.g. serial on the nameplate is 120045"></textarea></div>
    <div class="stack">
      <button type="button" class="btn btn-primary btn-big" id="problem-send">Tell the warehouse supervisor</button>
      <button type="button" class="btn btn-danger btn-big hidden" id="problem-defect">This equipment is defect</button>
      <a class="btn btn-big hidden" id="problem-add" href="#">Add this equipment now</a>
      <button type="button" class="btn" id="problem-cancel">Cancel</button>
    </div>
  </dialog>

  <script src="/vendor/jsQR.js" defer></script>
  <script type="module" src="/js/field.js"></script>
</body>
</html>
