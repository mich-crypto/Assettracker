<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overview · AssetTracker</title>
  <meta name="theme-color" content="#0b5cad">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main>
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <h1 style="margin:0">Overview</h1>
      <div class="row">
        <span class="muted" id="updated"></span>
        <button class="btn" id="btn-paper" type="button">Paper list (PDF)</button>
      </div>
    </div>
    <div class="kpis" id="kpis"></div>

    <section class="card">
      <div class="section-head"><h2>SOV</h2></div>
      <div id="bar-sov"></div>
      <div class="table-wrap"><table class="unit-table">
        <thead><tr><th>Equipment</th><th>Fuel</th><th>Status</th><th>Last check</th></tr></thead>
        <tbody id="sov-rows"></tbody>
      </table></div>
    </section>

    <section class="card">
      <div class="section-head"><h2>Turbines</h2></div>
      <div id="bar-wtg"></div>
      <div class="table-wrap"><table class="unit-table">
        <thead><tr><th>WTG</th><th>Equipment</th><th>Fuel</th><th>Status</th><th>Last check</th></tr></thead>
        <tbody id="wtg-rows"></tbody>
      </table></div>
    </section>

    <div class="card"><div id="map" role="region" aria-label="Map of equipment on turbines"></div></div>

    <details class="card report" id="svc-card">
      <summary><b>Service report</b> <span class="muted" id="svc-count"></span> <span class="muted">· defects, inspections and alarms</span></summary>
      <div class="row report-tools"><button class="btn" type="button" id="svc-copy">Copy as text</button></div>
      <div class="table-wrap"><table class="unit-table"><thead><tr><th>Location</th><th>Equipment</th><th>Needs</th><th>Last serviced</th></tr></thead><tbody id="svc-rows"></tbody></table></div>
    </details>

    <details class="card report" id="fuel-card">
      <summary><b>Refuel planning</b> <span class="muted" id="fuel-count"></span> <span class="muted">· where to bring fuel</span></summary>
      <div class="row report-tools">
        <label for="fuel-max">Fuel level at or below</label>
        <select id="fuel-max"><option value="25">25 %</option><option value="50" selected>50 %</option><option value="75">75 %</option></select>
        <button class="btn" type="button" id="fuel-copy">Copy as text</button>
      </div>
      <div class="table-wrap"><table class="unit-table"><thead><tr><th>Turbine</th><th>Equipment</th><th>Fuel</th><th>Last check</th></tr></thead><tbody id="fuel-rows"></tbody></table></div>
    </details>

    <div class="paper" id="paper"></div>
  </main>
  <aside class="drawer hidden" id="drawer" aria-labelledby="d-title"></aside>
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script type="module" src="/js/overview.js"></script>
</body>
</html>
